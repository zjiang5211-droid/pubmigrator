<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — PUBMigrator Guides</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ site_url }}/guides/{{ slug }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ site_url }}/guides/{{ slug }}">
<style>
:root{--bg:#f7f5f0;--ink:#1d1a16;--muted:#6b6459;--accent:#b3341f;--accent-d:#8f2817;--card:#ffffff;--line:#e6e0d4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header.top{padding:26px 0 6px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;text-decoration:none;color:var(--ink)}
.logo span{color:var(--accent)}
nav.breadcrumb{font-size:14px;color:var(--muted);margin:8px 0 0}
nav.breadcrumb a{color:var(--accent);text-decoration:none}
article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 30px;margin:22px 0}
article h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.8px;line-height:1.2;margin:0 0 6px}
article .desc{color:var(--muted);font-size:17px;margin:0 0 20px}
article h2{font-size:22px;margin:32px 0 10px;letter-spacing:-.4px}
article h3{font-size:18px;margin:24px 0 8px}
article p{margin:12px 0}
article ul,article ol{margin:12px 0;padding-left:24px}
article li{margin:6px 0}
article a{color:var(--accent)}
article code{background:#f1ece2;padding:2px 6px;border-radius:6px;font-size:.92em}
article pre{background:#2b2723;color:#f2ede4;padding:16px;border-radius:10px;overflow-x:auto;font-size:14px}
article pre code{background:none;padding:0}
article blockquote{border-left:3px solid var(--accent);margin:16px 0;padding:6px 16px;color:var(--muted);background:#fdf9f4;border-radius:0 8px 8px 0}
article img{max-width:100%;border-radius:8px}
.cta{margin:26px 0;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center}
.cta a.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;padding:12px 28px;border-radius:10px;text-decoration:none;margin-top:10px}
.cta a.btn:hover{background:var(--accent-d)}
footer{margin:40px 0 30px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="logo" href="/">PUB<span>Migrator</span></a></header>
<nav class="breadcrumb"><a href="/">Home</a> &rsaquo; <a href="/guides">Guides</a> &rsaquo; {{ title }}</nav>
<article>
<h1>{{ title }}</h1>
<p class="desc">{{ description }}</p>
{{ content|safe }}
</article>
<div class="cta">
<strong>Put this guide to work.</strong><br>
<span style="color:var(--muted)">Batch-convert your .pub files to PDF free — with a per-file verification report.</span><br>
<a class="btn" href="/">Try the free converter</a>
</div>
<footer>PUBMigrator — the converter that tells you which files it broke.</footer>
</div>
</body>
</html>
